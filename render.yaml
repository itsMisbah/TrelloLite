databases:
  - name: taskflow-db
    databaseName: taskflow_db
    user: taskflow
    region: oregon

services:
  - type: web
    name: taskflow
    runtime: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: RENDER
        value: true
      - key: DATABASE_URL
        fromDatabase:
          name: taskflow-db
          property: connectionString
